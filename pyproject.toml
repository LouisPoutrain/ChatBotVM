[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "victoria-rag"
version = "1.0.0"
description = "High-precision Hybrid RAG system with Dense E5, BM25 FastEmbed, Cross-Encoder Reranking, HyDE expansion and RAC semantic expert routing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Louis Poutrain", email = "louispoutrain337@gmail.com" }
]
keywords = [
    "rag",
    "qdrant",
    "hybrid-search",
    "bm25",
    "dense-retrieval",
    "cross-encoder",
    "hyde",
    "fastapi",
    "nlp"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]
dependencies = [
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.5",
    "qdrant-client>=1.16.1,<1.17.0",
    "fastembed>=0.7.0",
    "sentence-transformers>=3.0.0,<5.2.0",
    "torch>=2.1.0",
    "langchain-text-splitters>=0.3.0",
    "rapidfuzz>=3.9.0",
    "rouge-score>=0.1.2",
    "PyMuPDF>=1.24.14,<1.25.0",
    "pdfplumber>=0.11.0,<0.12.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0,<11.0.0",
    "marker-pdf>=0.2.17",
    "lxml>=5.2.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "reportlab>=4.2.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "gradio>=4.44.1,<5.0.0",
    "streamlit>=1.38.0",
    "loguru>=0.7.2",
    "apscheduler>=3.10.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.9.0"
]

[project.urls]
Homepage = "https://github.com/LouisPoutrain/ChatBotVM"
Repository = "https://github.com/LouisPoutrain/ChatBotVM"
Documentation = "https://github.com/LouisPoutrain/ChatBotVM#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["BV*", "RAC*", "RAGilaas*", "Utilitaire*", "Interface*"]
exclude = ["tests*", "Test*", "TestExtraction*", "docs*", "PDF2*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
